server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: estoque-api
  data:
    mongodb:
      # Local: mongodb://localhost:27017/estoque
      # Docker Compose / Kubernetes: mongodb://mongo:27017/estoque (nome do service)
      uri: ${MONGODB_URI:mongodb://localhost:27017/estoque}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

app:
  # Origens liberadas para o frontend (separe por virgula)
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  # Fuso usado para "hoje", "mes atual" e filtros de data dos relatorios
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  # Versao exibida em /api/info (util para demonstrar a atualizacao v1 -> v2 no Kubernetes)
  versao: ${APP_VERSION:v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

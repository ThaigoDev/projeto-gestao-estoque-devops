apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: estoque
spec:
  replicas: 2             # K3: API com 2 replicas
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # nunca derruba um Pod antes de o novo estar pronto
      maxSurge: 1
  template:
    metadata:
      labels: { app: api }
    spec:
      # Espera o Mongo aceitar conexoes antes de iniciar (evita reinicio no primeiro deploy).
      initContainers:
        - name: espera-mongo
          image: lucashc1011/estoque-api:v1
          command: ["sh", "-c", "until nc -z mongo 27017; do echo aguardando mongo; sleep 2; done"]
      containers:
        - name: api
          image: lucashc1011/estoque-api:v1   # trocado pelo kustomize (veja kustomization.yaml)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017/estoque
            - name: CORS_ORIGINS
              value: "*"
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 8"] }   # da tempo ao Service tirar o Pod dos endpoints
          startupProbe:                  # tolera a API subir antes do Mongo
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: estoque
spec:
  type: ClusterIP
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080

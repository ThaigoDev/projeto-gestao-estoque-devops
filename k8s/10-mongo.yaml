# MongoDB (imagem oficial) com volume persistente.
# - PersistentVolumeClaim: os dados ficam no volume, nao no Pod (K4/K6).
# - Deployment com 1 replica e estrategia Recreate: o Pod antigo para antes do novo
#   subir, pois o volume ReadWriteOnce so pode ser montado por um Pod de cada vez.
# - Service ClusterIP "mongo": acessivel so de dentro do cluster, pela URI
#   mongodb://mongo:27017/estoque usada pela API e pelo Worker.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: estoque
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: estoque
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: estoque
spec:
  type: ClusterIP
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017

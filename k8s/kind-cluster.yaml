# Cluster Kubernetes local com 3 nos (1 control-plane + 2 workers) usando kind.
#   kind create cluster --name estoque --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # NodePort 30080 do Service do frontend -> http://localhost:8081
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
